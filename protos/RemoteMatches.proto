syntax = "proto3";
package gphotos;

message RemoteMatches {
  message Field1Type {
    message Field2Type {
      message Field1Type {
        bytes sha1_hash = 1;
      }
      Field1Type field1 = 1;
      message Field2Type {
        string media_key = 1;
        message Field6Type {
          string media_key = 1;
          message Field2Type {
            string field1 = 1;
            string field3 = 3;
          }
          Field2Type field2 = 2;
        }
        Field6Type field6 = 6;
      }
      Field2Type field2 = 2;
    }
    Field2Type field2 = 2;
  }
  Field1Type field1 = 1;
}
