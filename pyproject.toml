[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpic"
version = "0.2.0"
description = "Python tool to push pics and videos to Google Photos"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "protobuf>=5.0",
    "rich>=13.0",
]

[project.scripts]
gpic = "gphotos.cli:cli"

[tool.setuptools.packages.find]
include = ["gphotos*"]

[dependency-groups]
dev = []
